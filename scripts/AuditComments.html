<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ comment audit</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.05);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --tally: #b4b2aa;
  --pass: #138a5f;
  --warn: #c98500;
  --fail: #d63c3b;
  --pass-wash: rgba(27, 175, 122, 0.12);
  --warn-wash: rgba(237, 161, 0, 0.14);
  --fail-wash: rgba(227, 73, 72, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --tally: #5a5955;
    --pass: #3ccf95;
    --warn: #f2c440;
    --fail: #ff7a72;
    --pass-wash: rgba(60, 207, 149, 0.14);
    --warn-wash: rgba(242, 196, 64, 0.14);
    --fail-wash: rgba(255, 122, 114, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink-1: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.06);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --tally: #5a5955;
  --pass: #3ccf95;
  --warn: #f2c440;
  --fail: #ff7a72;
  --pass-wash: rgba(60, 207, 149, 0.14);
  --warn-wash: rgba(242, 196, 64, 0.14);
  --fail-wash: rgba(255, 122, 114, 0.14);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink-1);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
a { color: var(--series-1); }
.sub { color: var(--ink-2); margin: 2px 0 0; }
.muted { color: var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.panelhead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.panelhead > div:first-child { flex: 1 1 320px; }
.segmented { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segmented button { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 6px 12px; cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--ring); }
.segmented button[aria-pressed="true"] { color: var(--ink-1); background: var(--wash); font-weight: 600; }
.verdict { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; font-size: 15px; border: 1px solid var(--ring); }
.verdict.pass { background: var(--pass-wash); color: var(--pass); }
.verdict.warn { background: var(--warn-wash); color: var(--warn); }
.verdict.fail { background: var(--fail-wash); color: var(--fail); }
.verdict .note { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .value small { font-size: 14px; font-weight: 400; color: var(--ink-3); }
.tile .note { color: var(--ink-3); font-size: 12px; }
.tile.fail { border-color: var(--fail); background: var(--fail-wash); }
.tile.warn { border-color: var(--warn); background: var(--warn-wash); }
.scope { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; font-size: 13px; }
.scope dt { color: var(--ink-3); }
.scope dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.scope code, td code { font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--wash); border-radius: 4px; padding: 0 4px; }
.status { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.status.ok { color: var(--pass); background: var(--pass-wash); }
.status.warn { color: var(--warn); background: var(--warn-wash); }
.status.fail { color: var(--fail); background: var(--fail-wash); }
.status.plain { color: var(--ink-2); background: var(--wash); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--ink-2); font-size: 12px; margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.bars { position: relative; display: grid; grid-template-columns: minmax(120px, max-content) 1fr max-content; gap: 4px 12px; align-items: center; font-size: 13px; }
.bars .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .track { height: 14px; background: var(--wash); border-radius: 4px; overflow: hidden; }
.bars .fill { height: 100%; border-radius: 4px; background: var(--series-1); }
.bars .fill.root { background: var(--tally); }
.bars .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink-1); border: 1px solid var(--ring); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); padding: 8px 10px; font-size: 12px; min-width: 170px; max-width: 420px; display: none; z-index: 5; }
.tip .head { font-weight: 600; overflow-wrap: anywhere; }
.tip .meta { color: var(--ink-3); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row .num { margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--ring); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
th.l, td.l { text-align: left; }
th.group { text-align: center; }
thead th { vertical-align: bottom; }
th.sort { cursor: pointer; user-select: none; }
th.sort[aria-sort="descending"]::after { content: " \2193"; }
th.sort[aria-sort="ascending"]::after { content: " \2191"; }
tr.total td { font-weight: 600; border-bottom: 0; }
td.path { white-space: normal; overflow-wrap: anywhere; text-align: left; min-width: 240px; }
td.path .dir { color: var(--ink-3); }
td.wrap { white-space: normal; text-align: left; }
#gates a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--ink-3); }
.code { font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre; text-align: left; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
.subhead { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-weight: 600; scroll-margin-top: 12px; }
.subhead.first { margin-top: 4px; }
.subhead .count { color: var(--ink-3); font-weight: 400; }
.subhead.warn { color: var(--warn); }
.subhead.fail { color: var(--fail); }
.subhead.ok { color: var(--ink-1); }
.lead { color: var(--ink-3); font-size: 13px; margin: 0 0 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.toolbar input { font: inherit; color: var(--ink-1); background: var(--page); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; min-width: 240px; flex: 1 1 240px; }
button.more { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--ring); border-radius: 8px; padding: 6px 12px; cursor: pointer; margin-top: 8px; }
.empty { color: var(--ink-3); padding: 8px 0; }
.list { margin: 0; padding-left: 18px; }
.list li { overflow-wrap: anywhere; }
footer { color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 16px; }
@media (max-width: 640px) {
  .bars { grid-template-columns: minmax(80px, 40%) 1fr max-content; }
  .toolbar input { min-width: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>__TITLE__ comment audit</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div id="links" class="sub"></div>
  </header>

  <div class="verdict" id="verdict" role="status"></div>

  <section class="panel">
    <h2>Result</h2>
    <div class="tablewrap"><table id="gates"></table></div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="panel">
    <h2>Ceilings</h2>
    <div class="tablewrap"><table id="ceilings"></table></div>
  </section>

  <section class="panel">
    <h2>Scope</h2>
    <dl class="scope" id="scope"></dl>
  </section>

  <section class="panel">
    <div class="panelhead">
      <div>
        <h2>Comment lines by folder</h2>
        <div class="muted">Density is the number of non-blank comment lines written per non-blank source line.</div>
      </div>
      <div class="segmented" role="group" aria-label="Measure" id="metric"></div>
    </div>
    <div class="bars" id="folderbars"></div>
    <div class="tablewrap" style="margin-top: 16px"><table id="foldertable"></table></div>
  </section>

  <section class="panel">
    <h2>Findings</h2>
    <div id="findings"></div>
  </section>

  <section class="panel">
    <div class="panelhead">
      <div>
        <h2 id="alltitle"></h2>
        <div class="muted">Every comment file the audit read, with its paired sources and its hash state. Click a column heading to sort.</div>
      </div>
      <div class="segmented" role="group" aria-label="State" id="statefilter"></div>
    </div>
    <div class="toolbar"><input type="search" id="filter" placeholder="Filter by path or source" aria-label="Filter comment files by path or source"></div>
    <div class="tablewrap"><table id="alltable"></table></div>
    <div class="empty" id="allempty" style="display:none">None.</div>
    <button type="button" class="more" id="allmore"></button>
  </section>

  <footer id="footer"></footer>
</main>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  'use strict';
  var d = JSON.parse(document.getElementById('data').textContent);
  var NF = new Intl.NumberFormat('en-US');
  var PF = new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var RF = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var DOT = ' \u00b7 ';
  var DASH = '\u2014';
  var LQ = '\u201c', RQ = '\u201d';
  var LIMIT = 100;
  var METRICS = [
    { key: 'lines', label: 'Lines' }, { key: 'nonBlank', label: 'Non-blank' }, { key: 'files', label: 'Files' },
    { key: 'bytes', label: 'Sizes' }, { key: 'density', label: 'Density' }
  ];

  function fmt(n) { return n === null || n === undefined ? DASH : NF.format(n); }
  function pct(part, whole) { return whole > 0 ? PF.format(part / whole * 100) + ' %' : '0.0 %'; }
  function ratio(part, whole) { return RF.format(whole > 0 ? part / whole : 0); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pathHtml(path) {
    var cut = path.lastIndexOf('/');
    return cut < 0 ? esc(path) : '<span class="dir">' + esc(path.slice(0, cut + 1)) + '</span>' + esc(path.slice(cut + 1));
  }
  function slug(text) { return 'sec-' + String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function statusClass(s) { return s === 'FAIL' ? 'fail' : s === 'WARN' ? 'warn' : 'ok'; }
  function load(key, fallback, allowed) {
    try { var v = localStorage.getItem('auditcomments.' + key); if (v !== null && (!allowed || allowed.indexOf(v) >= 0)) return v; } catch (e) { }
    return fallback;
  }
  function save(key, value) { try { localStorage.setItem('auditcomments.' + key, value); } catch (e) { } }
  function segmented(box, options, current, onPick) {
    box.innerHTML = '';
    options.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label;
      b.setAttribute('aria-pressed', String(o.key === current));
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); });
        onPick(o.key);
      });
      box.appendChild(b);
    });
  }
  function makeTip(box) {
    var tip = document.createElement('div');
    tip.className = 'tip';
    box.appendChild(tip);
    return {
      show: function (html, x, y) {
        tip.innerHTML = html;
        tip.style.display = 'block';
        var bw = box.clientWidth, tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(bw - tw, x + 14)) + 'px';
        tip.style.top = (y + 14) + 'px';
      },
      hide: function () { tip.style.display = 'none'; }
    };
  }
  function pointer(box, ev) {
    var r = box.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function gateOf(section) { return d.gates.filter(function (g) { return g.section === section; })[0]; }

  // Totals.
  var totals = { files: 0, lines: 0, nonBlank: 0, bytes: 0, sourceFiles: 0, sourceNonBlank: 0 };
  d.folders.forEach(function (f) { Object.keys(totals).forEach(function (k) { totals[k] += f[k]; }); });
  d.folders.forEach(function (f) { f.density = f.sourceNonBlank > 0 ? f.nonBlank / f.sourceNonBlank : 0; });

  // Header, verdict and result.
  document.getElementById('subtitle').textContent = 'Version ' + d.version + DOT + d.generated + DOT + fmt(d.scanned.sources) + ' source files' + DOT +
    fmt(d.scanned.comments) + ' comment files' + DOT + 'Generation ' + d.generation;
  document.getElementById('links').innerHTML = d.reports.map(function (r) { return '<a href="' + esc(r.link) + '">' + esc(r.name) + '</a>'; }).join(DOT);

  var failed = d.gates.filter(function (g) { return g.status === 'FAIL'; });
  var warned = d.gates.filter(function (g) { return g.status === 'WARN'; });
  function seeList(list) { return 'See ' + list.map(function (g) { return '<a href="#' + slug(g.section) + '">' + LQ + esc(g.section) + RQ + '</a>'; }).join(', ') + '.'; }
  var verdict = document.getElementById('verdict');
  if (failed.length === 0 && warned.length === 0) {
    verdict.className = 'verdict pass';
    verdict.innerHTML = 'PASS: all ' + d.gates.length + ' gates at 0.';
  } else if (failed.length === 0) {
    verdict.className = 'verdict warn';
    verdict.innerHTML = 'PASS: no gate fails, ' + warned.length + ' of ' + d.gates.length + ' gates warn.<span class="note">' + seeList(warned) + '</span>';
  } else {
    verdict.className = 'verdict fail';
    verdict.innerHTML = 'FAIL: ' + failed.length + ' of ' + d.gates.length + ' gates above 0.<span class="note">' + seeList(failed) + '</span>';
  }

  document.getElementById('gates').innerHTML =
    '<thead><tr><th class="l">Status</th><th>Count</th><th class="l">Gate</th><th class="l">Meaning</th></tr></thead><tbody>' +
    d.gates.map(function (g) {
      return '<tr><td class="l"><span class="status ' + statusClass(g.status) + '">' + g.status + '</span></td><td>' + fmt(g.count) +
        '</td><td class="l"><a href="#' + slug(g.section) + '">' + esc(g.gate) + '</a></td><td class="l muted">' + esc(g.meaning) + '</td></tr>';
    }).join('') + '</tbody>';

  // Tiles.
  var stateCounts = {};
  d.comments.forEach(function (c) { stateCounts[c.state] = (stateCounts[c.state] || 0) + 1; });
  var findingTotal = d.gates.reduce(function (s, g) { return s + (g.status === 'FAIL' ? g.count : 0); }, 0);
  var tiles = [];
  tiles.push('<div class="tile ' + (failed.length ? 'fail' : '') + '"><div class="label">Failing findings</div><div class="value">' + fmt(findingTotal) +
    '</div><div class="note">' + fmt(failed.length) + ' of ' + fmt(d.gates.length) + ' gates fail</div></div>');
  d.ceilings.forEach(function (c) {
    var cls = c.ceiling > c.count || c.count > c.ceiling ? 'fail' : c.count > 0 ? 'warn' : '';
    var note = c.ceiling > c.count ? 'Stale: ceiling above its count' : c.count > c.ceiling ? 'Above the ceiling' : 'At or below the ceiling';
    tiles.push('<div class="tile ' + cls + '"><div class="label">' + esc(c.kind) + '</div><div class="value">' + fmt(c.count) +
      ' <small>/ ' + fmt(c.ceiling) + '</small></div><div class="note">' + note + '</div></div>');
  });
  tiles.push('<div class="tile"><div class="label">Comment files</div><div class="value">' + fmt(totals.files) + '</div><div class="note">for ' +
    fmt(d.scanned.sources) + ' source files</div></div>');
  tiles.push('<div class="tile"><div class="label">Stamped</div><div class="value">' + fmt(stateCounts.stamped || 0) + '</div><div class="note">' +
    pct(stateCounts.stamped || 0, d.comments.length) + ' of comment files carry a current hash</div></div>');
  tiles.push('<div class="tile"><div class="label">Comment lines</div><div class="value">' + fmt(totals.lines) + '</div><div class="note">' +
    fmt(totals.nonBlank) + ' non-blank</div></div>');
  tiles.push('<div class="tile"><div class="label">Sizes</div><div class="value">' + fmt(totals.bytes) + '</div><div class="note">' +
    fmt(totals.files ? Math.round(totals.bytes / totals.files) : 0) + ' bytes per file</div></div>');
  tiles.push('<div class="tile"><div class="label">Density</div><div class="value">' + ratio(totals.nonBlank, totals.sourceNonBlank) + '</div><div class="note">' +
    'comment lines per source line</div></div>');
  document.getElementById('tiles').innerHTML = tiles.join('');

  // Ceilings.
  document.getElementById('ceilings').innerHTML =
    '<thead><tr><th class="l">Key</th><th class="l">Kind</th><th>Count</th><th>Ceiling</th><th class="l">State</th></tr></thead><tbody>' +
    d.ceilings.map(function (c) {
      var s = c.ceiling > c.count ? ['fail', 'STALE'] : c.count > c.ceiling ? ['fail', 'ABOVE'] : c.count > 0 ? ['warn', 'WARN'] : ['ok', 'OK'];
      return '<tr><td class="l"><code>' + esc(c.key) + '</code></td><td class="l">' + esc(c.kind) + '</td><td>' + fmt(c.count) + '</td><td>' + fmt(c.ceiling) +
        '</td><td class="l"><span class="status ' + s[0] + '">' + s[1] + '</span></td></tr>';
    }).join('') + '</tbody>';

  // Scope.
  function codes(list) { return list.length ? list.map(function (x) { return '<code>' + esc(x) + '</code>'; }).join(' ') : 'None'; }
  var scopeRows = [
    ['Source roots', esc(d.scope.roots.join(', '))],
    ['Root-level files', d.scope.files.length ? esc(d.scope.files.join(', ')) : 'None'],
    ['Comment pattern', codes([d.scope.commentPattern])],
    ['Pairs', d.scope.pairs.map(function (p) { return '<code>' + esc(p.suffix) + '</code> \u2192 <code>' + esc(p.template) + '</code>'; }).join(', ')],
    ['Folder segments', String(d.scope.segments)],
    ['Word limit', fmt(d.scope.maxWords) + ' words per line, one sentence per line'],
    ['Forbidden marks', codes(d.scope.forbidden)],
    ['Sentence marks', codes(d.scope.sentenceMarks)],
    ['Abbreviations', codes(d.scope.abbreviations)],
    ['In-code markers', d.scope.markers.map(function (m) { return esc(m.extension) + ' ' + codes(m.tokens); }).join(', ')],
    ['Block closers', d.scope.closers.map(function (c) { return '<code>' + esc(c.open) + '</code> \u2026 <code>' + esc(c.close) + '</code>'; }).join(', ')],
    ['Exempt files', d.scope.exemptFiles.length ? esc(d.scope.exemptFiles.join(', ')) : 'None'],
    ['Exempt comment files', d.scope.exemptComments.length ? esc(d.scope.exemptComments.join(', ')) + ' (developer only, never judged)' : 'None'],
    ['Excluded folders', esc(d.scope.excluded.join(', '))],
    ['Excluded suffixes', d.scope.excludedSuffixes.length ? esc(d.scope.excludedSuffixes.join(', ')) : 'None']
  ];
  document.getElementById('scope').innerHTML = scopeRows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('');

  // Folder totals.
  var barBox = document.getElementById('folderbars');
  var barTip = makeTip(barBox);
  var metric = load('metric', 'lines', METRICS.map(function (m) { return m.key; }));
  segmented(document.getElementById('metric'), METRICS, metric, function (k) { metric = k; save('metric', k); drawFolders(); });
  function metricText(f, key) { return key === 'density' ? RF.format(f.density) : fmt(f[key]); }
  function drawFolders() {
    var list = d.folders.slice().sort(function (a, b) { return b[metric] - a[metric] || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
    var peak = list.reduce(function (m, f) { return Math.max(m, f[metric]); }, 0) || 1;
    barBox.querySelectorAll('.name, .track, .num').forEach(function (n) { n.remove(); });
    list.forEach(function (f) {
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = f.name;
      var track = document.createElement('div');
      track.className = 'track';
      track.innerHTML = '<div class="fill' + (f.name === '(root)' ? ' root' : '') + '" style="width:' + (f[metric] / peak * 100).toFixed(2) + '%"></div>';
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = metricText(f, metric);
      [name, track, num].forEach(function (n) {
        n.addEventListener('mousemove', function (ev) {
          var p = pointer(barBox, ev);
          barTip.show('<div class="head">' + esc(f.name) + '</div><div class="meta">' + fmt(f.sourceFiles) + ' sources' + DOT + fmt(f.files) + ' comment files</div>' +
            '<div class="row"><span>Lines</span><span class="num">' + fmt(f.lines) + '</span></div>' +
            '<div class="row"><span>Non-blank</span><span class="num">' + fmt(f.nonBlank) + '</span></div>' +
            '<div class="row"><span>Bytes</span><span class="num">' + fmt(f.bytes) + '</span></div>' +
            '<div class="row"><span>Share of lines</span><span class="num">' + pct(f.lines, totals.lines) + '</span></div>' +
            '<div class="row"><span>Density</span><span class="num">' + RF.format(f.density) + '</span></div>', p.x, p.y);
        });
        n.addEventListener('mouseleave', barTip.hide);
        barBox.appendChild(n);
      });
    });
  }
  (function () {
    function row(f, cls) {
      return '<tr class="' + cls + '"><td class="l">' + esc(f.name) + '</td><td>' + fmt(f.sourceFiles) + '</td><td>' + fmt(f.files) + '</td><td>' + fmt(f.lines) +
        '</td><td>' + fmt(f.nonBlank) + '</td><td>' + pct(f.lines, totals.lines) + '</td><td>' + fmt(f.bytes) + '</td><td>' + pct(f.bytes, totals.bytes) +
        '</td><td>' + fmt(f.files ? Math.round(f.bytes / f.files) : 0) + '</td><td>' + ratio(f.nonBlank, f.sourceNonBlank) + '</td></tr>';
    }
    var total = { name: 'Total', sourceFiles: totals.sourceFiles, files: totals.files, lines: totals.lines, nonBlank: totals.nonBlank, bytes: totals.bytes, sourceNonBlank: totals.sourceNonBlank };
    document.getElementById('foldertable').innerHTML =
      '<thead><tr><th class="l" rowspan="2">Folder</th><th rowspan="2">Sources</th><th rowspan="2">Files</th><th class="group" colspan="3">Lines</th>' +
      '<th class="group" colspan="3">Sizes</th><th rowspan="2">Density</th></tr>' +
      '<tr><th>Raw</th><th>Non-blank</th><th>Share</th><th>Total</th><th>Share</th><th>Average</th></tr></thead><tbody>' +
      d.folders.map(function (f) { return row(f, ''); }).join('') + row(total, 'total') + '</tbody>';
  })();

  // Findings, in the console order.
  var findingBox = document.getElementById('findings');
  function block(spec, index) {
    var wrap = document.createElement('div');
    findingBox.appendChild(wrap);
    var gate = gateOf(spec.section);
    var status = gate ? gate.status : 'OK';
    var shown = LIMIT;
    function draw() {
      var items = spec.items;
      var count = spec.count === undefined ? items.length : spec.count;
      var html = '<div class="subhead ' + statusClass(status) + (index === 0 ? ' first' : '') + '" id="' + slug(spec.section) + '">' +
        '<span class="status ' + statusClass(status) + '">' + status + '</span>' + esc(spec.title) + ' <span class="count">(' + fmt(count) +
        (spec.extra ? ', ' + spec.extra : '') + ')</span></div>';
      if (spec.lead) html += '<p class="lead">' + spec.lead + '</p>';
      if (!items.length) html += '<div class="empty">None.</div>';
      else if (spec.list) html += '<ul class="list">' + items.slice(0, shown).map(function (x) { return '<li>' + spec.list(x) + '</li>'; }).join('') + '</ul>';
      else html += '<div class="tablewrap"><table>' + spec.head + '<tbody>' + items.slice(0, shown).map(spec.row).join('') + '</tbody></table></div>';
      wrap.innerHTML = html;
      if (items.length > shown) {
        var more = document.createElement('button');
        more.type = 'button';
        more.className = 'more';
        more.textContent = 'Show all ' + fmt(items.length) + ' (' + fmt(items.length - shown) + ' hidden)';
        more.addEventListener('click', function () { shown = Infinity; draw(); });
        wrap.appendChild(more);
      }
    }
    draw();
  }
  function hitHead(kind) { return '<thead><tr><th>Line</th><th class="l">' + kind + '</th><th class="l">File</th><th class="l">Text</th></tr></thead>'; }
  function hitRow(h) {
    return '<tr><td>' + fmt(h.line) + '</td><td class="l">' + esc(h.kind) + '</td><td class="path">' + pathHtml(h.path) +
      '</td><td class="code" title="' + esc(h.text) + '">' + esc(h.text) + '</td></tr>';
  }
  var ceiling = d.ceilings[0];
  var staleCeilings = d.ceilings.filter(function (c) { return c.ceiling > c.count; });
  [
    { section: 'Sources without a comment file', title: 'Sources without a comment file', items: d.missing,
      head: '<thead><tr><th class="l">Source</th><th class="l">Expected comment file</th></tr></thead>',
      row: function (m) { return '<tr><td class="path">' + pathHtml(m.path) + '</td><td class="l">' + esc(m.expected) + '</td></tr>'; } },
    { section: 'Comment files without a source', title: 'Comment files without a source', items: d.orphans,
      list: function (p) { return pathHtml(p); } },
    { section: 'Comment lines breaking the line rules', title: 'Comment lines breaking the line rules', items: d.rules, head: hitHead('Problem'), row: hitRow },
    { section: 'Headings naming nothing in their source', title: 'Headings naming nothing in their source', items: d.headings, head: hitHead('Problem'), row: hitRow },
    { section: 'Comment files with a stale hash', title: 'Comment files with a stale hash', items: d.stale, head: hitHead('Problem'), row: hitRow,
      lead: d.stale.length ? d.staleAdvice.map(esc).join(' ') : '' },
    { section: 'Comment files restamped unrevised', title: 'Comment files restamped unrevised', items: d.restamped, head: hitHead('Problem'), row: hitRow,
      lead: d.restamped.length ? '<strong>' + d.restampAdvice.map(esc).join(' ') + '</strong>' : '' },
    { section: 'Comment files with no hash', title: 'Comment files with no hash', items: d.unstamped, head: hitHead('Problem'), row: hitRow,
      extra: 'ceiling ' + fmt(ceiling.ceiling),
      lead: 'A warning while the count sits at or below the ceiling of ' + fmt(ceiling.ceiling) + ', a failure above it. Reread each file, then stamp it with stampcomment.ps1 and lower the ceiling.' },
    { section: 'Stale ceilings', title: 'Stale ceilings', items: staleCeilings,
      list: function (c) { return '<code>' + esc(c.key) + '</code> is ' + fmt(c.ceiling) + ' but only ' + fmt(c.count) + ' comment files carry no hash, so lower it.'; } },
    { section: 'In-code comments', title: 'In-code comments', items: d.remarks, head: hitHead('Marker'), row: hitRow },
    { section: 'Unreadable files', title: 'Unreadable files', items: d.unreadable, list: function (u) { return esc(u); } }
  ].forEach(block);

  // Every comment file.
  var findingsByPath = {};
  [d.rules, d.headings].forEach(function (list) { list.forEach(function (h) { findingsByPath[h.path] = (findingsByPath[h.path] || 0) + 1; }); });
  d.comments.forEach(function (c) { c.findings = findingsByPath[c.path] || 0; c.source = c.sources.join(', '); });
  var STATECLASS = { 'stamped': 'ok', 'no hash': 'warn', 'stale': 'fail', 'no source': 'fail', 'unreadable': 'fail', 'exempt': 'plain' };
  var STATES = ['stamped', 'stale', 'no hash', 'no source', 'exempt', 'unreadable'].filter(function (s) { return stateCounts[s]; });
  var COLUMNS = [
    { key: 'state', label: 'State', num: false }, { key: 'lines', label: 'Lines', num: true }, { key: 'nonBlank', label: 'Non-blank', num: true },
    { key: 'bytes', label: 'Bytes', num: true }, { key: 'findings', label: 'Line findings', num: true }, { key: 'folder', label: 'Folder', num: false },
    { key: 'path', label: 'Comment file', num: false }, { key: 'source', label: 'Sources', num: false }
  ];
  var sortKey = load('sort', 'path', COLUMNS.map(function (c) { return c.key; }));
  var sortDown = load('down', 'false', ['true', 'false']) === 'true';
  var stateKey = load('state', 'all', ['all'].concat(STATES));
  var shownAll = LIMIT;
  segmented(document.getElementById('statefilter'), [{ key: 'all', label: 'All ' + fmt(d.comments.length) }].concat(STATES.map(function (s) {
    return { key: s, label: s.charAt(0).toUpperCase() + s.slice(1) + ' ' + fmt(stateCounts[s]) };
  })), stateKey, function (k) { stateKey = k; save('state', k); shownAll = LIMIT; drawAll(); });
  var filterBox = document.getElementById('filter');
  filterBox.addEventListener('input', function () { shownAll = LIMIT; drawAll(); });
  document.getElementById('allmore').addEventListener('click', function () { shownAll = Infinity; drawAll(); });
  function drawAll() {
    var q = filterBox.value.trim().toLowerCase();
    var list = d.comments.filter(function (c) {
      return (stateKey === 'all' || c.state === stateKey) && (!q || c.path.toLowerCase().indexOf(q) >= 0 || c.source.toLowerCase().indexOf(q) >= 0);
    });
    var col = COLUMNS.filter(function (c) { return c.key === sortKey; })[0];
    list.sort(function (a, b) {
      var r = col.num ? a[sortKey] - b[sortKey] : (a[sortKey] < b[sortKey] ? -1 : a[sortKey] > b[sortKey] ? 1 : 0);
      if (r === 0) r = a.path < b.path ? -1 : a.path > b.path ? 1 : 0;
      return sortDown ? -r : r;
    });
    document.getElementById('alltitle').textContent = 'Every comment file (' + fmt(d.comments.length) + ')';
    var head = '<thead><tr>' + COLUMNS.map(function (c) {
      return '<th class="sort' + (c.num ? '' : ' l') + '" data-key="' + c.key + '"' + (c.key === sortKey ? ' aria-sort="' + (sortDown ? 'descending' : 'ascending') + '"' : '') + '>' + c.label + '</th>';
    }).join('') + '</tr></thead>';
    var body = list.slice(0, shownAll).map(function (c) {
      return '<tr><td class="l"><span class="status ' + (STATECLASS[c.state] || 'plain') + '">' + esc(c.state) + '</span></td><td>' + fmt(c.lines) + '</td><td>' + fmt(c.nonBlank) +
        '</td><td>' + fmt(c.bytes) + '</td><td>' + (c.findings ? '<span class="status fail">' + fmt(c.findings) + '</span>' : '0') + '</td><td class="l">' + esc(c.folder) +
        '</td><td class="path">' + pathHtml(c.path) + '</td><td class="path">' + (c.sources.length ? c.sources.map(pathHtml).join('<br>') : '<span class="muted">' + DASH + '</span>') + '</td></tr>';
    }).join('');
    var table = document.getElementById('alltable');
    table.innerHTML = head + '<tbody>' + body + '</tbody>';
    Array.prototype.forEach.call(table.querySelectorAll('th.sort'), function (th) {
      th.addEventListener('click', function () {
        var k = th.getAttribute('data-key');
        if (k === sortKey) sortDown = !sortDown;
        else { sortKey = k; sortDown = COLUMNS.filter(function (c) { return c.key === k; })[0].num; }
        save('sort', sortKey); save('down', String(sortDown));
        drawAll();
      });
    });
    document.getElementById('allempty').style.display = list.length ? 'none' : '';
    var more = document.getElementById('allmore');
    more.style.display = list.length > shownAll ? '' : 'none';
    more.textContent = 'Show all ' + fmt(list.length) + ' (' + fmt(list.length - Math.min(shownAll, list.length)) + ' hidden)';
  }

  document.getElementById('footer').innerHTML = '<span>' + esc(d.project) + ' ' + esc(d.version) + '</span><span>Generated ' + esc(d.generated) + '</span>' +
    '<span>' + fmt(d.scanned.sources) + ' source files' + DOT + fmt(d.scanned.comments) + ' comment files</span>';

  drawFolders();
  drawAll();
})();
</script>
</body>
</html>
